name: Tag and Release

# Every push to main (normally a merged PR) becomes a GitHub release: the
# version in startos/versions/current.ts is tagged `v<upstream>_<downstream>`
# and the .s9pk for each architecture is built and attached to a GitHub
# release of the same name, with SHA256 sums and the release notes.
#
# Start9's reusable release workflow is not used: it needs a registry to query
# before tagging, and it hands the .s9pk files between jobs as Actions
# artifacts, which fails once the account's artifact storage quota is full
# (these packages are about 650 MB each). Here every build job uploads its
# own package straight to the release; the release is created or updated in
# place, so the jobs do not race.
#
# Signing: the DEV_KEY repository secret (the PEM `start-cli init-key` writes
# to ~/.startos/id.key.pem) is used when present, so every release carries
# the same identity. Without it the build job generates a key for the run.

on:
  push:
    branches: ['main']
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast gates, before any image is built: a release never ships code that
  # fails typecheck, lint, formatting or the server's unit tests. The root
  # npm audit is informational: its findings sit in the SDK's build-time lint
  # tooling, which is not part of the image (see README.md, Development).
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: StartOS package (typecheck, SDK lint, prettier)
        run: |
          npm ci
          npm run check
          node node_modules/@start9labs/start-sdk/lint.mjs
          npx prettier --check startos
        shell: bash

      - name: Agent API and MCP server (typecheck, tests, audit)
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test
          npm audit --audit-level=high
        shell: bash

      - name: Root npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
        shell: bash

  tag:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      version: ${{ steps.extract.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract package ID and version
        id: extract
        uses: Start9Labs/start-technologies/.github/actions/extract-version@master

      - name: Check whether this version is already released
        id: check
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; nothing to release. Bump startos/versions/current.ts to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} is new; releasing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Push release tag
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"
        shell: bash

      # Created here, once, so the two build jobs below only attach assets and
      # never race to create the same release.
      - name: Create the GitHub release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract.outputs.tag }}
          name: ${{ steps.extract.outputs.version }}
          generate_release_notes: true
          body: |
            HyperFrames ${{ steps.extract.outputs.version }} for StartOS. Sideload the `.s9pk` for your server's architecture (`x86_64` or `aarch64`). SHA256 sums are in the `SHA256SUMS-*.txt` files. Release notes as shown in StartOS are in `startos/versions/current.ts`.

  release:
    needs: tag
    if: needs.tag.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86, runner: ubuntu-latest }
          - { target: arm, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Setup build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Checkout repository at the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}
          submodules: recursive

      # A DEV_KEY secret gives every release the same signing identity. Without
      # one, a fresh key is generated here so the release still goes out.
      - name: Provision the signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          mkdir -p ~/.startos .startos
          if [ -n "$DEV_KEY" ]; then
            printf '%s' "$DEV_KEY" > ~/.startos/id.key.pem
            echo "Signing with the DEV_KEY secret."
          else
            start-cli init-key
            echo "::warning::No DEV_KEY secret: this release is signed with a key generated for this run."
          fi
          cp ~/.startos/id.key.pem .startos/build.key.pem
        shell: bash

      - name: Install package dependencies
        run: npm ci
        shell: bash

      - name: Build (make ${{ matrix.target }})
        run: |
          make ${{ matrix.target }}
          echo ""
          echo "SHA256SUMs:"
          sha256sum *.s9pk | tee "SHA256SUMS-${{ matrix.target }}.txt"
        shell: bash

      - name: Attach the package to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: |
            ./*.s9pk
            ./SHA256SUMS-${{ matrix.target }}.txt
