name: Tag and Release

on:
  push:
    branches: ['main']
    paths-ignore: ['*.md']
  workflow_dispatch:

# The shared workflow keeps the release draft until BOTH native QA bundles
# are complete and read back; existing versions are never overwritten.
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/directRelease.yml
    with:
      mode: stable
      expected_sha: ${{ github.sha }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
