name: Build

# Pull requests (including forks) are read-only native build checks.
# Premerge package delivery uses exact-head reviewed manual directRelease.yml
# RC dispatch, never privileged PR execution or the Actions artifact service.

on:
  workflow_dispatch:
    inputs:
      deliver_assets:
        description: Build verified native RC assets directly to a private draft
        type: boolean
        default: false
      expected_sha:
        description: Full reviewed branch HEAD, required for RC delivery
        type: string
        default: ''
  pull_request:
    paths-ignore: ['*.md']
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gates, before any image is built: a release never ships code that
  # fails typecheck, lint, formatting or the server's unit tests. The root
  # npm audit is informational: its findings sit in the SDK's build-time lint
  # tooling, which is not part of the image (see README.md, Development).
  checks:
    if: github.event_name != 'workflow_dispatch' || !inputs.deliver_assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: StartOS package (typecheck, SDK lint, prettier)
        run: |
          npm ci
          npm run check
          node node_modules/@start9labs/start-sdk/lint.mjs
          npx prettier --check startos
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
        shell: bash

      - name: Agent API and MCP server (typecheck, tests, audit)
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test
          npm audit --audit-level=high
        shell: bash

      - name: Root npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
        shell: bash

  build:
    needs: checks
    if: success() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86, runner: ubuntu-latest }
          - { target: arm, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Setup build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      # A PR build does not publish, so a throwaway key is fine.
      - name: Provision a workspace signing key
        run: |
          start-cli init-key
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem
        shell: bash

      - name: Install package dependencies
        run: npm ci
        shell: bash

      - name: Build (make ${{ matrix.target }})
        run: |
          start-cli s9pk init-workspace ..
          make ${{ matrix.target }}
          echo ""
          echo "SHA256SUMs:"
          sha256sum ./*.s9pk
        shell: bash

  # This existing workflow ID enables premerge dispatch before the newly added
  # reusable workflow exists on default main. It never runs for PR events.
  deliver_rc:
    if: github.event_name == 'workflow_dispatch' && inputs.deliver_assets && github.repository == 'bitcoinRph/hyperframes-startos'
    permissions:
      contents: write
    uses: ./.github/workflows/directRelease.yml
    with:
      mode: rc
      expected_sha: ${{ inputs.expected_sha }}
