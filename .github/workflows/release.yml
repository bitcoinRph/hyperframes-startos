name: Release

on:
  push:
    tags: ['v*.*']

# Shared gate: drafts first, both native QA bundles before publication.
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/directRelease.yml
    with:
      mode: stable
      expected_sha: ${{ github.sha }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
