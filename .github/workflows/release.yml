name: Release

# Manual path: pushing a `v<upstream>_<downstream>` tag by hand builds the
# .s9pk files and creates (or updates) the GitHub release for that tag.
# Tags pushed by the Tag and Release workflow do not trigger this (GitHub
# does not chain workflows started with GITHUB_TOKEN); that workflow calls
# the release workflow directly instead.

on:
  push:
    tags:
      - 'v*.*'

jobs:
  release:
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      TAG: ${{ github.ref_name }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
    permissions:
      contents: write
